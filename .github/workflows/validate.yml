name: Validate UI Kit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Fetch pinned Shutter Manager visual reference
        run: |
          curl --fail --location --output /tmp/shutter-reference.js https://raw.githubusercontent.com/v9h45n47mh-lab/shutter-manager/c5214c5edce79104330875db173343b66b502908/custom_components/rollladenplaner/frontend/shutter-manager-card.js
          test "$(git hash-object /tmp/shutter-reference.js)" = dc661b6dca0fbb40a0e57ed6f13f2c887ee3648f
      - run: npm run test:browser
        env:
          SHUTTER_REFERENCE: /tmp/shutter-reference.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: test-results/

  publish:
    if: ${{ github.repository == 'v9h45n47mh-lab/ha-ui-kit' && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-ui-kit]') }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Publish verified UI Kit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const {version}=JSON.parse(fs.readFileSync('package.json','utf8'));
          const section=fs.readFileSync('CHANGELOG.md','utf8').split(/^## /m).find(part=>part.startsWith(version+' '));
          if(!section)throw new Error('Missing release notes for '+version);
          fs.writeFileSync('/tmp/ha-ui-kit-release-notes.md',section.split('\n').slice(1).join('\n').trim()+'\n');
          JS
          python -m zipfile -c "../HA-UI-Kit-${version}.zip" dist LICENSE
          gh release create "v${version}" --repo v9h45n47mh-lab/ha-ui-kit --target "$RELEASE_COMMIT" --title "HA UI Kit ${version}" --notes-file /tmp/ha-ui-kit-release-notes.md "../HA-UI-Kit-${version}.zip"
