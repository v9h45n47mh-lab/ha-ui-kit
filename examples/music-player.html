<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HA UI Kit · Musicplayer</title><style>body{margin:0;background:#f3f5f7;--primary-color:#03a9f4;--primary-text-color:#212121;--secondary-text-color:#727272;--card-background-color:#fff;--secondary-background-color:#f5f5f5;--divider-color:#ddd}body.dark{background:#11151b;--primary-text-color:#f1f3f5;--secondary-text-color:#afb7c1;--card-background-color:#1b222c;--secondary-background-color:#252e3a;--divider-color:#394451}kit-music-example{display:block;max-width:500px;margin:16px auto}</style><kit-music-example></kit-music-example><script type="module">
import {UI_CSS,MUSIC_PLAYER_CSS,musicPlayerHeader,musicTransport,musicFavoriteTile,rangeControl,dialog,row,iconButton,bindUI} from '../dist/family-ui.js';
class Example extends HTMLElement{constructor(){super();this.attachShadow({mode:'open'});this.shadowRoot.innerHTML=`<style>${UI_CSS}\n${MUSIC_PLAYER_CSS}</style><ha-card><main><div class="music-stack">${musicPlayerHeader({title:'Musik für den Abend',description:'Interpret · Wiedergabe',speakerSelect:{id:'speaker',value:'bedroom',options:[{value:'bedroom',label:'Sonos Schlafzimmer'},{value:'office',label:'Büro'}]}})}${musicTransport({controls:[{label:'Zurück',action:'previous',icon:'previous'},{label:'Pause',action:'play-pause',icon:'pause'},{label:'Weiter',action:'next',icon:'next'},{label:'Shuffle',action:'shuffle',icon:'shuffle',pressed:true}]})}${rangeControl({id:'volume',label:'Lautstärke',min:0,max:50,value:50,allowKeep:false,action:'volume'})}<div class="music-favorites">${musicFavoriteTile({label:'Mein Sender',kind:'radio',data:{index:0}})}${musicFavoriteTile({label:'Meine Playlist',data:{index:1}})}</div></div></main></ha-card>${dialog({id:'settings',title:'Einstellungen',content:row({title:'Sender',trailing:iconButton({icon:'right',label:'Sender wählen',action:'radio'})})+row({title:'Apple Music',trailing:iconButton({icon:'right',label:'Apple Music öffnen',action:'apple'})})})}`;bindUI(this.shadowRoot,({action})=>{if(action==='player-settings')this.shadowRoot.getElementById('settings').showModal();});}}customElements.define('kit-music-example',Example);
</script></html>
